name: Release

# Gera os instaladores (macOS e Windows) e publica na Release quando uma tag "v*" é enviada.
# Também pode ser disparado à mão (Actions > Release > Run workflow) informando a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.1.1)'
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mac
            os: macos-latest
            scripts: 'dist:mac'
          - name: windows
            os: windows-latest
            scripts: 'dist:win dist:win-legacy'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for script in ${{ matrix.scripts }}; do
            npm run "$script"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.exe
            dist-legacy/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        run: |
          mapfile -t files < <(find artifacts -type f \( -name '*.zip' -o -name '*.exe' \) | sort)
          printf 'Arquivos:\n%s\n' "${files[@]}"
          sed "s/{{version}}/${TAG#v}/g" .github/release-notes.md > release-notes.generated.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Player YouTube ${TAG#v}" \
              --notes-file release-notes.generated.md
          fi

  # Reescreve os links da tabela de downloads do README com a versão publicada.
  update-readme:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update README download links
        run: node scripts/update-readme-downloads.mjs "${TAG#v}" "$GITHUB_REPOSITORY"
      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "README já estava atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update download links to ${TAG}"
          git pull --rebase origin main
          git push origin HEAD:main
