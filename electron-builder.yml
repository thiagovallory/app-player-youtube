appId: com.thiagovallory.player-youtube
productName: Player YouTube
compression: maximum
directories:
  output: dist
files:
  - out/**
  - build/icon.png
  - package.json
mac:
  category: public.app-category.video
  icon: build/icon.icns
  identity: "-"
  hardenedRuntime: false
  electronLanguages:
    - pt_BR
    - en
  target:
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: Player-YouTube-mac-${arch}.${ext}
win:
  icon: build/icon.ico
  electronLanguages:
    - pt-BR
    - en-US
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  buildUniversalInstaller: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Player YouTube
  artifactName: Player-YouTube-win-${arch}-setup.${ext}
portable:
  artifactName: Player-YouTube-win-${arch}-portable.${ext}
