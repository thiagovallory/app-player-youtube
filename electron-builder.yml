appId: com.thiagonunes.player-youtube
productName: Player YouTube
compression: maximum
directories:
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.video
  identity: "-"
  hardenedRuntime: false
  electronLanguages:
    - pt_BR
    - en
  target:
    - target: zip
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
win:
  electronLanguages:
    - pt-BR
    - en-US
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}-win-portable.${ext}
